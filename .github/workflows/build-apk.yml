name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract game
        run: |
          mkdir -p source

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP game not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          unzip -q "$ZIP" -d source

      - name: Find HTML game
        run: |
          HTML=$(find source -type f -name "*.html" | head -n 1)

          if [ -z "$HTML" ]; then
            echo "HTML game not found"
            exit 1
          fi

          echo "HTML found: $HTML"

          echo "HTML=$HTML" >> "$GITHUB_ENV"

      - name: Prepare HTML viewport
        run: |
          python3 - <<'PY'
          import os
          import re

          html_path = os.environ["HTML"]

          with open(html_path, "r", encoding="utf-8") as f:
              html = f.read()

          viewport = '<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">'

          if 'name="viewport"' not in html.lower():
              if re.search(r"<head[^>]*>", html, flags=re.IGNORECASE):
                  html = re.sub(
                      r"(<head[^>]*>)",
                      r"\1\n" + viewport,
                      html,
                      count=1,
                      flags=re.IGNORECASE
                  )
              else:
                  html = viewport + "\n" + html

          with open(html_path, "w", encoding="utf-8") as f:
              f.write(html)

          print("HTML viewport prepared successfully.")
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android project
        run: |

          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/java/com/azzurra/mondo

          cp "$HTML" android/app/src/main/assets/index.html

          if [ -f "app_icon.png" ]; then
            cp app_icon.png android/app/src/main/res/drawable/app_icon.png
          else
            echo "app_icon.png not found"
            exit 1
          fi

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Il-Mondo-di-Azzurra"

          include(":app")
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > android/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.azzurra.mondo'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.azzurra.mondo'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#7C4DFF</item>

              </style>

          </resources>
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="Il Mondo di Azzurra"
                  android:icon="@drawable/app_icon"
                  android:roundIcon="@drawable/app_icon"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > android/app/src/main/java/com/azzurra/mondo/MainActivity.java <<'EOF'
          package com.azzurra.mondo;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  requestWindowFeature(Window.FEATURE_NO_TITLE);

                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );

                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  );

                  WebView webView = new WebView(this);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);

                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  settings.setMediaPlaybackRequiresUserGesture(false);

                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);

                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setSupportZoom(false);

                  settings.setTextZoom(100);

                  webView.setWebViewClient(new WebViewClient());

                  webView.setFocusable(true);
                  webView.setFocusableInTouchMode(true);
                  webView.requestFocus();

                  webView.setVerticalScrollBarEnabled(false);
                  webView.setHorizontalScrollBarEnabled(false);

                  setContentView(webView);

                  webView.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

            - name: Build APK
          run: |
          cd android
          gradle assembleDebug

      - name: Find APK
        run: |
          echo "Searching for APK files..."
          find android -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Il-Mondo-di-Azzurra-APK
          path: android/**/*.apk
          if-no-files-found: error
        
          
      
        
        

