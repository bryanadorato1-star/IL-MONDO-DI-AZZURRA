

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract game
        run: |
          set -e

          mkdir -p source

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found"
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          unzip -q "$ZIP" -d source

      - name: Find HTML game
        run: |
          set -e

          HTML=$(find source -type f -name "*.html" | head -n 1)

          if [ -z "$HTML" ]; then
            echo "ERROR: HTML game not found"
            exit 1
          fi

          echo "HTML found: $HTML"
          echo "HTML=$HTML" >> "$GITHUB_ENV"

      - name: Fix mobile game
        run: |
          set -e

          python3 - <<'PY'
          import os
          import re

          html_path = os.environ["HTML"]

          with open(html_path, "r", encoding="utf-8") as f:
              html = f.read()

          # -------------------------------------------------
          # VIEWPORT
          # -------------------------------------------------

          viewport = (
              '<meta name="viewport" '
              'content="width=device-width, initial-scale=1.0, '
              'maximum-scale=1.0, user-scalable=no">'
          )

          if 'name="viewport"' not in html.lower():
              match = re.search(r'</head\s*>', html, re.IGNORECASE)

              if match:
                  html = (
                      html[:match.start()]
                      + viewport
                      + "\n"
                      + html[match.start():]
                  )
              else:
                  html = viewport + "\n" + html

          # -------------------------------------------------
          # MOBILE MENU FIX
          # -------------------------------------------------

          mobile_css = r"""
          <style id="android-mobile-fix">

          html,
          body {
              width: 100% !important;
              height: 100% !important;
              margin: 0 !important;
              padding: 0 !important;
              overflow: hidden !important;
              touch-action: manipulation !important;
              -webkit-user-select: none !important;
              user-select: none !important;
              -webkit-tap-highlight-color: transparent !important;
          }

          body.homeScreen {
              overflow: hidden !important;
          }

          body.homeScreen .app {
              width: 100% !important;
              height: 100% !important;
              max-width: none !important;
              margin: 0 !important;
              padding: 0 !important;
          }

          body.homeScreen .menuStage {
              position: fixed !important;
              left: 0 !important;
              top: 0 !important;
              right: 0 !important;
              bottom: 0 !important;

              width: 100% !important;
              height: 100% !important;

              margin: 0 !important;
              padding: 0 !important;

              overflow: hidden !important;
              background: #000 !important;

              display: block !important;
          }

          body.homeScreen .menuBoard {
              position: absolute !important;

              left: 50% !important;
              top: 50% !important;

              width: min(150vh, 100vw) !important;
              height: min(100vh, 66.6666667vw) !important;

              margin: 0 !important;
              padding: 0 !important;

              transform: translate(-50%, -50%) !important;

              aspect-ratio: 3 / 2 !important;

              overflow: hidden !important;

              max-width: none !important;
              max-height: none !important;
          }

          body.homeScreen .menuBoard > img {
              position: absolute !important;

              left: 0 !important;
              top: 0 !important;
              right: 0 !important;
              bottom: 0 !important;

              width: 100% !important;
              height: 100% !important;

              max-width: none !important;
              max-height: none !important;

              margin: 0 !important;
              padding: 0 !important;

              object-fit: fill !important;
              object-position: center !important;

              display: block !important;

              pointer-events: none !important;
          }

          body.homeScreen .menuHotspot {
              position: absolute !important;

              display: block !important;

              margin: 0 !important;
              padding: 0 !important;

              border: 0 !important;

              background: transparent !important;

              z-index: 1000 !important;

              pointer-events: auto !important;

              touch-action: manipulation !important;

              -webkit-tap-highlight-color: transparent !important;

              cursor: pointer !important;
          }

          body.homeScreen .menuHotspot:focus {
              outline: none !important;
          }

          body.homeScreen .menuHotspot:active {
              transform: scale(0.98) !important;
          }

          </style>
          """

          # -------------------------------------------------
          # TOUCH FIX
          # -------------------------------------------------

          touch_js = r"""
          <script id="android-touch-fix">
          (function () {

              function prepareTouch() {

                  var selectors = [
                      ".menuHotspot",
                      ".menuTopSpot",
                      "button",
                      "a",
                      "[role='button']"
                  ];

                  document.querySelectorAll(selectors.join(",")).forEach(function(el) {
                      el.style.pointerEvents = "auto";
                      el.style.touchAction = "manipulation";
                      el.style.webkitTapHighlightColor = "transparent";
                  });
              }

              if (document.readyState === "loading") {
                  document.addEventListener("DOMContentLoaded", prepareTouch);
              } else {
                  prepareTouch();
              }

              window.addEventListener("load", prepareTouch);

          })();
          </script>
          """

          # Insert CSS before </head>
          head_match = re.search(r'</head\s*>', html, re.IGNORECASE)

          if head_match:
              html = (
                  html[:head_match.start()]
                  + mobile_css
                  + "\n"
                  + html[head_match.start():]
              )
          else:
              html = mobile_css + "\n" + html

          # Insert JS before </body>
          body_match = re.search(r'</body\s*>', html, re.IGNORECASE)

          if body_match:
              html = (
                  html[:body_match.start()]
                  + touch_js
                  + "\n"
                  + html[body_match.start():]
              )
          else:
              html += touch_js

          with open(html_path, "w", encoding="utf-8") as f:
              f.write(html)

          print("Mobile HTML correction completed.")
          PY

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
