name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract game
        run: |
          set -e

          mkdir -p source

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found"
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          unzip -q "$ZIP" -d source

      - name: Find HTML game
        run: |
          set -e

          HTML=$(find source -type f -name "*.html" | head -n 1)

          if [ -z "$HTML" ]; then
            echo "ERROR: HTML game not found"
            exit 1
          fi

          echo "HTML found: $HTML"
          echo "HTML=$HTML" >> "$GITHUB_ENV"

      - name: Fix mobile game
        run: |
          set -e

          python3 - <<'PY'
          import os
          import re

          html_path = os.environ["HTML"]

          with open(html_path, "r", encoding="utf-8") as f:
              html = f.read()

          # -------------------------------------------------
          # VIEWPORT
          # -------------------------------------------------

          viewport = (
              '<meta name="viewport" '
              'content="width=device-width, initial-scale=1.0, '
              'maximum-scale=1.0, user-scalable=no">'
          )

          if 'name="viewport"' not in html.lower():
              match = re.search(r'</head\s*>', html, re.IGNORECASE)

              if match:
                  html = (
                      html[:match.start()]
                      + viewport
                      + "\n"
                      + html[match.start():]
                  )
              else:
                  html = viewport + "\n" + html

          # -------------------------------------------------
          # MOBILE MENU FIX
          # -------------------------------------------------

          mobile_css = r"""
          <style id="android-mobile-fix">

          html,
          body {
              width: 100% !important;
              height: 100% !important;
              margin: 0 !important;
              padding: 0 !important;
              overflow: hidden !important;
              touch-action: manipulation !important;
              -webkit-user-select: none !important;
              user-select: none !important;
              -webkit-tap-highlight-color: transparent !important;
          }

          body.homeScreen {
              overflow: hidden !important;
          }

          body.homeScreen .app {
              width: 100% !important;
              height: 100% !important;
              max-width: none !important;
              margin: 0 !important;
              padding: 0 !important;
          }

          body.homeScreen .menuStage {
              position: fixed !important;
              left: 0 !important;
              top: 0 !important;
              right: 0 !important;
              bottom: 0 !important;

              width: 100% !important;
              height: 100% !important;

              margin: 0 !important;
              padding: 0 !important;

              overflow: hidden !important;
              background: #000 !important;

              display: block !important;
          }

          body.homeScreen .menuBoard {
              position: absolute !important;

              left: 50% !important;
              top: 50% !important;

              width: min(150vh, 100vw) !important;
              height: min(100vh, 66.6666667vw) !important;

              margin: 0 !important;
              padding: 0 !important;

              transform: translate(-50%, -50%) !important;

              aspect-ratio: 3 / 2 !important;

              overflow: hidden !important;

              max-width: none !important;
              max-height: none !important;
          }

          body.homeScreen .menuBoard > img {
              position: absolute !important;

              left: 0 !important;
              top: 0 !important;
              right: 0 !important;
              bottom: 0 !important;

              width: 100% !important;
              height: 100% !important;

              max-width: none !important;
              max-height: none !important;

              margin: 0 !important;
              padding: 0 !important;

              object-fit: fill !important;
              object-position: center !important;

              display: block !important;

              pointer-events: none !important;
          }

          body.homeScreen .menuHotspot {
              position: absolute !important;

              display: block !important;

              margin: 0 !important;
              padding: 0 !important;

              border: 0 !important;

              background: transparent !important;

              z-index: 1000 !important;

              pointer-events: auto !important;

              touch-action: manipulation !important;

              -webkit-tap-highlight-color: transparent !important;

              cursor: pointer !important;
          }

          body.homeScreen .menuHotspot:focus {
              outline: none !important;
          }

          body.homeScreen .menuHotspot:active {
              transform: scale(0.98) !important;
          }

          </style>
          """

          # -------------------------------------------------
          # TOUCH FIX
          # -------------------------------------------------

          touch_js = r"""
          <script id="android-touch-fix">
          (function () {

              function prepareTouch() {

                  var selectors = [
                      ".menuHotspot",
                      ".menuTopSpot",
                      "button",
                      "a",
                      "[role='button']"
                  ];

                  document.querySelectorAll(selectors.join(",")).forEach(function(el) {
                      el.style.pointerEvents = "auto";
                      el.style.touchAction = "manipulation";
                      el.style.webkitTapHighlightColor = "transparent";
                  });
              }

              if (document.readyState === "loading") {
                  document.addEventListener("DOMContentLoaded", prepareTouch);
              } else {
                  prepareTouch();
              }

              window.addEventListener("load", prepareTouch);

          })();
          </script>
          """

          # Insert CSS before </head>
          head_match = re.search(r'</head\s*>', html, re.IGNORECASE)

          if head_match:
              html = (
                  html[:head_match.start()]
                  + mobile_css
                  + "\n"
                  + html[head_match.start():]
              )
          else:
              html = mobile_css + "\n" + html

          # Insert JS before </body>
          body_match = re.search(r'</body\s*>', html, re.IGNORECASE)

          if body_match:
              html = (
                  html[:body_match.start()]
                  + touch_js
                  + "\n"
                  + html[body_match.start():]
              )
          else:
              html += touch_js

          with open(html_path, "w", encoding="utf-8") as f:
              f.write(html)

          print("Mobile HTML correction completed.")
          PY

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android project
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          files = {

          "android/settings.gradle": r"""
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Il-Mondo-di-Azzurra"

          include(":app")
          """,

          "android/build.gradle": r"""
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          """,

          "android/gradle.properties": r"""
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          """,

          "android/app/build.gradle": r"""
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.azzurra.mondo'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.azzurra.mondo'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          """,

          "android/app/src/main/res/values/styles.xml": r"""
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#7C4DFF</item>

              </style>

          </resources>
          """,

          "android/app/src/main/AndroidManifest.xml": r"""
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="Il Mondo di Azzurra"
                  android:icon="@drawable/app_icon"
                  android:roundIcon="@drawable/app_icon"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          """,

          "android/app/src/main/java/com/azzurra/mondo/MainActivity.java": r"""
          package com.azzurra.mondo;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  requestWindowFeature(Window.FEATURE_NO_TITLE);

                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );

                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  );

                  WebView webView = new WebView(this);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);

                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  settings.setMediaPlaybackRequiresUserGesture(false);

                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);

                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setSupportZoom(false);

                  settings.setTextZoom(100);

                  webView.setWebViewClient(new WebViewClient());

                  webView.setFocusable(true);
                  webView.setFocusableInTouchMode(true);
                  webView.requestFocus();

                  webView.setVerticalScrollBarEnabled(false);
                  webView.setHorizontalScrollBarEnabled(false);

                  webView.setOverScrollMode(View.OVER_SCROLL_NEVER);

                  setContentView(webView);

                  webView.loadUrl(
                      "file:///android_asset/index.html"
                  );
              }
          }
          """
          }

          for name, content in files.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content.strip() + "\n", encoding="utf-8")
              print("Created:", path)

          PY

          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res/drawable

          cp "$HTML" android/app/src/main/assets/index.html

          if [ ! -f "app_icon.png" ]; then
            echo "ERROR: app_icon.png not found"
            exit 1
          fi

          cp app_icon.png android/app/src/main/res/drawable/app_icon.png

      - name: Verify Android project
        run: |
          set -e

          echo "Checking Android project..."

          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/gradle.properties
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/assets/index.html
          test -f android/app/src/main/res/drawable/app_icon.png
          test -f android/app/src/main/java/com/azzurra/mondo/MainActivity.java

          echo "All required files are present."

      - name: Build APK
        run: |
          set -e

          cd android

          gradle assembleDebug

      - name: Find APK
        run: |
          set -e

          echo "Searching for APK files..."

          find android -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Il-Mondo-di-Azzurra-APK
          path: android/**/*.apk
          if-no-files-found: error
